services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin-lead-finder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkedin_leads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkedin_leads"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-lead-finder-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linkedin_leads?schema=public
      LINKEDIN_CDP_URL: http://host.docker.internal:9222
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-lead-finder-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linkedin_leads?schema=public
      SCRAPER_POLL_MS: "3000"
      LINKEDIN_CDP_URL: http://host.docker.internal:9222
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx tsx worker/scraper-worker.ts"

volumes:
  postgres_data:
