services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin-lead-finder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkedin_leads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkedin_leads"]
      interval: 5s
      timeout: 5s
      retries: 10

  browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-lead-finder-browser
    restart: unless-stopped
    environment:
      DISPLAY: ":99"
      LINKEDIN_PROFILE_DIR: /data/linkedin-profile
      LINKEDIN_CDP_PORT: "9222"
    ports:
      - "7900:7900"
      - "9222:9222"
    volumes:
      - linkedin_profile:/data/linkedin-profile
    command: sh -c "sed -i 's/\\r$//' worker/browser-entrypoint.sh && exec sh worker/browser-entrypoint.sh"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-lead-finder-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linkedin_leads?schema=public
      SCRAPER_POLL_MS: "3000"
      SCRAPER_HEADLESS: "true"
      SCRAPER_MAX_COMMENTS: "500"
      SCRAPER_MAX_REACTIONS: "500"
      LINKEDIN_CDP_URL: http://browser:9222
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-lead-finder-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linkedin_leads?schema=public
      SCRAPER_POLL_MS: "3000"
      SCRAPER_MAX_COMMENTS: "500"
      SCRAPER_MAX_REACTIONS: "500"
      LINKEDIN_CDP_URL: http://browser:9222
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_started
    command: sh -c "npx prisma generate && npm run worker"

volumes:
  postgres_data:
  linkedin_profile:
